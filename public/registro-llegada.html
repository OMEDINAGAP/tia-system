<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de llegada | TIA</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>:root{--navy:#08111f;--panel:#142033;--line:#2c3c53;--green:#22c55e;--muted:#a8b7ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Segoe UI,Arial,sans-serif;color:#eef4fb;background:radial-gradient(circle at 20% 10%,#17325b 0,transparent 31%),var(--navy)}.card{width:min(500px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:38px;box-shadow:0 24px 60px #0008;text-align:center}.plane{font-size:42px}.eyebrow{color:#6ee7a0;font-size:12px;letter-spacing:1.4px;font-weight:800;margin:16px 0 7px}.card h1{margin:0;font-size:28px}.card p{color:var(--muted);line-height:1.55}.form{margin-top:25px;text-align:left}.form label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.form input{width:100%;padding:15px;border-radius:10px;border:1px solid var(--line);background:#091422;color:white;font-size:16px;text-transform:uppercase}.form button{width:100%;margin-top:14px;border:0;border-radius:10px;background:var(--green);padding:14px;color:white;font-weight:800;font-size:15px;cursor:pointer}.note{font-size:12px;margin-top:20px!important}.swal2-popup{background:#142033!important;color:#eef4fb!important;border:1px solid #2c3c53!important}.swal2-title,.swal2-html-container{color:#eef4fb!important}</style></head><body><main class="card"><div class="plane">✈️</div><div class="eyebrow">MÓDULO TIA</div><h1>Registro de llegada</h1><p>Si fuiste enviado para toma física de fotografía, registra tu llegada antes de pasar con el personal TIA.</p><form class="form" id="arrivalForm"><label for="folio">Folio personal</label><input id="folio" name="folio" placeholder="TIA-P-XXXXXXXX" autocomplete="off" required><button type="submit">Registrar mi llegada</button></form><p class="note">El registro únicamente confirma tu llegada. La fotografía será tomada y validada por personal autorizado.</p></main><script>const form=document.getElementById('arrivalForm'),folio=document.getElementById('folio');folio.addEventListener('input',()=>folio.value=folio.value.toUpperCase());form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;button.textContent='Validando...';try{const response=await fetch('/toma-fisica/llegada',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folio:folio.value})}),data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||'No fue posible registrar la llegada');await Swal.fire({icon:data.completed?'info':'success',title:data.completed?'Trámite concluido':data.already?'Llegada ya registrada':'Llegada registrada',text:data.completed?data.message:data.already?'Tu llegada ya estaba registrada. Espera a ser llamado por personal TIA.':`${data.nombre||'Colaborador'}, espera a ser llamado por personal TIA.`});if(!data.completed){folio.value='';folio.focus()}}catch(error){Swal.fire('No fue posible continuar',error.message,'error')}finally{button.disabled=false;button.textContent='Registrar mi llegada'}});</script></body></html>
