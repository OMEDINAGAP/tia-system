<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta - TIA</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);height:100vh;display:flex;align-items:center;justify-content:center;color:white}.container{box-sizing:border-box;background:#1e293b;border-radius:16px;padding:30px;width:min(400px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.5)}h2{text-align:center}p{text-align:center;color:#cbd5e1;font-size:14px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:0;margin-bottom:10px}button{background:#22c55e;color:white;font-weight:bold;cursor:pointer}.footer{text-align:center;font-size:12px;opacity:.6;margin-top:10px}</style></head>
<body><main class="container"><h2>Crear cuenta</h2><p>Estas credenciales se solicitaran cuando vuelvas a ingresar con el folio.</p><form id="form"><input name="usuario" placeholder="Usuario" minlength="4" maxlength="80" required autofocus><input name="password" type="password" placeholder="Contrasena (minimo 8 caracteres)" minlength="8" required><input name="confirmacion" type="password" placeholder="Confirmar contrasena" minlength="8" required><button>Activar cuenta</button></form><div class="footer">Sistema de Capacitacion Aeroportuaria</div></main>
<script>const token=sessionStorage.getItem('configurarCuentaToken');if(!token)location.replace('/');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));if(d.password!==d.confirmacion){Swal.fire('Aviso','Las contrasenas no coinciden','warning');return}const r=await fetch('/configurar-cuenta',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(d)});const x=await r.json();if(!r.ok||!x.ok){Swal.fire('Error',x.message||'No fue posible crear la cuenta','error');return}sessionStorage.clear();sessionStorage.setItem('gestionEmpresaToken',x.gestionToken);await Swal.fire('Cuenta activada','Revisa los requisitos antes de registrar a las personas que tomarán el curso','success');location.replace('/empresa-requisitos.html')});</script></body></html>
