<!DOCTYPE html>
<html>

<head>
  <title>Curso de Seguridad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .top-user-card {
      margin: 0 0 25px;
      background: #0f172a;
      border-radius: 18px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
      border: 1px solid #1e293b;
      color: white;
    }

    .user-info { display: flex; align-items: center; gap: 15px; }
    .user-avatar { width: 58px; height: 58px; border-radius: 50%; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid #22c55e; }
    .user-data h3 { margin: 0; font-size: 20px; font-weight: 700; }
    .user-data p { margin: 2px 0; color: #cbd5e1; font-size: 14px; }
    .user-data span { display: inline-block; margin-top: 4px; background: #22c55e; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .logout-btn { background: #ef4444; border: none; color: white; padding: 12px 18px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: .3s; }
    .logout-btn:hover { background: #dc2626; transform: translateY(-2px); }

    @media (max-width: 600px) {
      .top-user-card { align-items: flex-start; gap: 14px; flex-direction: column; }
      .logout-btn { width: 100%; }
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* CARD */
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* VIDEO */
    #videoWrapper {
      position: relative;
      margin-bottom: 15px;
      background: #000;
    }

    #videoWrapper:fullscreen { display: flex; align-items: center; justify-content: center; }
    #videoWrapper:fullscreen #player { width: 100%; height: 100%; }
    #videoWrapper:fullscreen iframe { width: 100% !important; height: 100% !important; }

    #blocker {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .presence-modal { display:none; position:fixed; inset:0; z-index:100; background:rgba(2,6,23,.86); padding:20px; align-items:center; justify-content:center; }
    .presence-modal.open { display:flex; }
    .presence-card { width:min(500px,100%); background:#1e293b; border:1px solid #334155; border-radius:18px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.55); text-align:center; }
    .presence-icon { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 14px; border-radius:50%; background:#123d28; color:#6ee7a0; font-size:28px; }
    .presence-card h2 { margin:0 0 10px; font-size:22px; }
    .presence-card p { color:#cbd5e1; line-height:1.55; margin:0 0 20px; }
    .presence-card small { display:block; color:#94a3b8; margin-top:14px; }
    .presence-card button { width:100%; background:#22c55e; color:white; border:0; padding:13px; border-radius:9px; font-weight:700; cursor:pointer; }

    /* PROGRESS */
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: 0.3s;
    }

    /* STATUS */
    .status {
      margin-top: 10px;
      font-weight: bold;
    }

    /* BOTONES */
    .btn-primary {
      background: #2563eb;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .video-controls { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn-success {
      background: #22c55e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      color: white;
      width: 100%;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .btn-secondary {
      background: #3b82f6;
      border: none;
      padding: 10px;
      border-radius: 8px;
      color: white;
      width: 100%;
      cursor: pointer;
    }

    /* ALERT */
    .alert {
      margin-top: 15px;
      color: #f87171;
      font-size: 14px;
    }

    /* BACK */
    .btn-back {
      background: #020617;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .btn-back:hover {
      background: #334155;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top-user-card">
      <div class="user-info">
        <div class="user-avatar">✈️</div>
        <div class="user-data">
          <h3 id="userName">Cargando...</h3>
          <p id="userCompany">Empresa</p>
          <span id="userFolio">Folio</span>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
    </div>

    <h1>🎥 Curso de Seguridad Aeroportuaria</h1>
    <p class="subtitle">Debes ver los videos completos para continuar.</p>

    <!-- 🎥 CARD VIDEO -->
    <div class="card">

      <div id="videoWrapper">
        <div id="player"></div>
        <div id="blocker"></div>
      </div>

      <div class="video-controls">
        <button onclick="togglePlay()" class="btn-primary">Reproducir / Pausar</button>
        <button onclick="toggleFullscreen()" class="btn-primary">Pantalla completa</button>
      </div>

      <p id="status" class="status">Pendiente</p>

      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>

      <p id="progress">Progreso total: 0%</p>

    </div>

    <!-- 📊 CARD ACCIONES -->
    <div class="card actions">

      <button id="btnExam" class="btn-success" onclick="goExam()" disabled hidden>
        Ir al examen
      </button>

      <div class="alert">
        ⚠️ No puedes adelantar ni cambiar de pestaña.
      </div>

    </div>

    <!-- 🔙 REGRESAR -->
    <button class="btn-back" onclick="goBack()">← Regresar</button>

  </div>

</body>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

  // 🔐 TOKEN
  const token = sessionStorage.getItem("token");


  if (!token) {
    alert("Sesión expirada");
    window.location.href = "/";
  }

  (async function requireCommitment() {
    try {
      const response = await fetch('/carta-compromiso', { headers: { Authorization: 'Bearer ' + token } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.aceptada) window.location.replace('/carta-compromiso.html');
    } catch (error) { window.location.replace('/'); }
  })();

  async function loadUserInfo() {
    try {
      const res = await fetch("/me", {
        headers: { Authorization: "Bearer " + token }
      });
      if (!res.ok) {
        logout();
        return;
      }
      const user = await res.json();
      document.getElementById("userName").innerText = user.name || "---";
      document.getElementById("userCompany").innerText =
        [user.company, user.puesto].filter(Boolean).join(" · ") || "---";
      document.getElementById("userFolio").innerText = user.folio || "Sin folio";
    } catch (err) {
      console.error("ERROR USER INFO:", err);
    }
  }

  function logout() {
    if (typeof stopPresenceCamera === 'function') stopPresenceCamera();
    sessionStorage.clear();
    window.location.href = "/";
  }

  loadUserInfo();

  // 🎥 VIDEOS (ORDENADOS)
  const videos = [
    "qnpYpzOIN0c",
    "YDpYySq7KIo"
  ];

  let currentVideoIndex = 0;

  // 🎥 VARIABLES
  let player;
  let duration = 0;
  let maxTime = 0;
  let wasPlaying = false;
  let lastSent = 0; // 🔥 ESTA FALTABA
  let videoProgressMap = {};
  let allowTracking = false;
  const PRESENCE_CHECKS_PER_VIDEO = 3;
  let presenceChecks = [];
  let presenceCheckIndex = 0;
  let presenceAwaiting = false;
  let presenceAuthorized = false;
  let presenceStream = null;
  let faceLandmarker = null;
  let faceMonitorTimer = null;
  let lastFaceSeenAt = 0;
  let activePresenceChallenge = null;

  document.body.insertAdjacentHTML('beforeend', `<div class="presence-modal" id="presenceModal" role="dialog" aria-modal="true"><div class="presence-card"><div class="presence-icon">✓</div><h2 id="presenceTitle">Validación de presencia</h2><p id="presenceText">Para iniciar el curso, autoriza la cámara frontal y realiza una validación de presencia.</p><video id="presencePreview" autoplay playsinline muted style="display:none;width:100%;max-height:220px;object-fit:cover;border-radius:10px;background:#020617;margin-bottom:14px"></video><canvas id="presenceCanvas" width="640" height="480" hidden></canvas><button type="button" id="presenceConfirm">Activar cámara y validar</button><small>La cámara solo se usa para esta validación en vivo. La imagen no se guarda.</small></div></div>`);

  // 🔒 CONTROL DE PESTAÑA
  document.addEventListener("visibilitychange", () => {



    if (!player || typeof player.getPlayerState !== "function") return;

    if (document.hidden) {
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        wasPlaying = true;
        player.pauseVideo();
      }
      document.getElementById("status").innerText = "⏸ Video pausado";
    } else {
      if (wasPlaying && !presenceAwaiting) {
        player.playVideo();
        wasPlaying = false;
      }
    }

  });

  function stopPresenceCamera() {
    if (presenceStream) presenceStream.getTracks().forEach(track => track.stop());
    presenceStream = null;
    const preview = document.getElementById('presencePreview');
    preview.srcObject = null;
    preview.style.display = 'none';
  }

  function openPresenceCheck(initial = false) {
    if (presenceAwaiting) return;
    presenceAwaiting = true;
    if (player && player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
    document.getElementById('status').innerText = 'Validación de presencia requerida';
    document.getElementById('presenceTitle').innerText = initial ? 'Antes de iniciar el curso' : 'Validación de presencia';
    document.getElementById('presenceText').innerText = initial ? 'Autoriza la cámara frontal y realiza una validación de presencia antes de reproducir el video.' : 'El video se pausó. Activa la cámara frontal y realiza una validación de presencia para continuar.';
    const button = document.getElementById('presenceConfirm');
    button.innerText = 'Activar cámara y validar';
    button.dataset.initial = initial ? '1' : '0';
    button.dataset.cameraReady = '0';
    document.getElementById('presenceModal').classList.add('open');
  }

  async function startPresenceCamera() {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Este navegador no permite usar la cámara para la validación.');
    presenceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    const preview = document.getElementById('presencePreview');
    preview.srcObject = presenceStream;
    preview.style.display = 'block';
    await preview.play();
  }

  document.getElementById('presenceConfirm').addEventListener('click', async () => {
    const button = document.getElementById('presenceConfirm');
    try {
      if (button.dataset.cameraReady !== '1') {
        button.disabled = true;
        button.innerText = 'Activando cámara...';
        await startPresenceCamera();
        button.dataset.cameraReady = '1';
        button.disabled = false;
        button.innerText = 'Confirmar presencia y continuar';
        return;
      }
      const preview = document.getElementById('presencePreview');
      if (preview.readyState < 2) throw new Error('La cámara aún no está lista. Intenta de nuevo.');
      const canvas = document.getElementById('presenceCanvas');
      canvas.getContext('2d').drawImage(preview, 0, 0, canvas.width, canvas.height);
      stopPresenceCamera();
      const isInitial = button.dataset.initial === '1';
      presenceAuthorized = true;
      presenceAwaiting = false;
      if (!isInitial) presenceCheckIndex++;
      document.getElementById('presenceModal').classList.remove('open');
      updateStatus();
      if (!isInitial && player) player.playVideo();
    } catch (error) {
      stopPresenceCamera();
      button.disabled = false;
      button.dataset.cameraReady = '0';
      button.innerText = 'Reintentar validación';
      document.getElementById('presenceText').innerText = error.message || 'No fue posible acceder a la cámara. Autoriza el permiso para continuar.';
    }
  });

  // 🎥 YOUTUBE READY
  /* Presencia automatizada: rostro continuo y reto aleatorio, sin guardar imágenes. */
  async function prepareFaceDetector() {
    if (faceLandmarker) return faceLandmarker;
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    faceLandmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true
    });
    return faceLandmarker;
  }

  stopPresenceCamera = function() {
    clearInterval(faceMonitorTimer);
    faceMonitorTimer = null;
    if (presenceStream) presenceStream.getTracks().forEach(track => track.stop());
    presenceStream = null;
    const preview = document.getElementById('presencePreview');
    preview.srcObject = null;
    preview.style.display = 'none';
  };

  function makePresenceChallenge(initial) {
    if (initial) return { type: 'face', text: 'Coloca tu rostro dentro del recuadro. La validación se completará automáticamente.' };
    const challenges = [
      { type: 'blink', text: 'Para continuar, parpadea mirando a la cámara.' },
      { type: 'right', text: 'Para continuar, gira ligeramente tu rostro hacia tu derecha.' },
      { type: 'left', text: 'Para continuar, gira ligeramente tu rostro hacia tu izquierda.' }
    ];
    return challenges[Math.floor(Math.random() * challenges.length)];
  }

  openPresenceCheck = function(initial = false) {
    if (presenceAwaiting) return;
    presenceAwaiting = true;
    if (player && player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
    activePresenceChallenge = makePresenceChallenge(initial);
    document.getElementById('status').innerText = 'Validación de presencia requerida';
    document.getElementById('presenceTitle').innerText = initial ? 'Antes de iniciar el curso' : 'Validación de presencia';
    document.getElementById('presenceText').innerText = presenceStream ? activePresenceChallenge.text : 'Autoriza la cámara frontal. Después se realizará una validación automática de presencia.';
    const button = document.getElementById('presenceConfirm');
    button.innerText = presenceStream ? 'Validando presencia...' : 'Activar cámara y validar';
    button.disabled = Boolean(presenceStream);
    document.getElementById('presencePreview').style.display = presenceStream ? 'block' : 'none';
    document.getElementById('presenceModal').classList.add('open');
  };

  function completePresenceCheck() {
    const initial = !presenceAuthorized;
    presenceAuthorized = true;
    presenceAwaiting = false;
    if (!initial) presenceCheckIndex++;
    activePresenceChallenge = null;
    document.getElementById('presencePreview').style.display = 'none';
    document.getElementById('presenceModal').classList.remove('open');
    updateStatus();
    if (!initial && player) player.playVideo();
  }

  function blendshapeScore(result, name) {
    const categories = result.faceBlendshapes?.[0]?.categories || [];
    return categories.find(item => item.categoryName === name)?.score || 0;
  }

  function evaluateDetectedFace(result) {
    const landmarks = result.faceLandmarks?.[0];
    if (!landmarks) return;
    lastFaceSeenAt = Date.now();
    if (!presenceAwaiting || !activePresenceChallenge) return;
    const type = activePresenceChallenge.type;
    if (type === 'face') return completePresenceCheck();
    if (type === 'blink' && blendshapeScore(result, 'eyeBlinkLeft') > .35 && blendshapeScore(result, 'eyeBlinkRight') > .35) return completePresenceCheck();
    const left = landmarks[234], right = landmarks[454], nose = landmarks[1];
    if (!left || !right || !nose) return;
    const ratio = (nose.x - left.x) / Math.max(.001, right.x - left.x);
    if ((type === 'right' && ratio > .60) || (type === 'left' && ratio < .40)) completePresenceCheck();
  }

  function monitorFacePresence() {
    if (!faceLandmarker || !presenceStream) return;
    const preview = document.getElementById('presencePreview');
    if (preview.readyState < 2) return;
    const result = faceLandmarker.detectForVideo(preview, performance.now());
    evaluateDetectedFace(result);
    const playing = player && player.getPlayerState() === YT.PlayerState.PLAYING;
    if (playing && lastFaceSeenAt && Date.now() - lastFaceSeenAt > 15000) openPresenceCheck(false);
  }

  startPresenceCamera = async function() {
    if (presenceStream) return;
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Este navegador no permite usar la cámara para la validación.');
    presenceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    const preview = document.getElementById('presencePreview');
    preview.srcObject = presenceStream;
    preview.style.display = 'block';
    await preview.play();
    await prepareFaceDetector();
    lastFaceSeenAt = Date.now();
    clearInterval(faceMonitorTimer);
    faceMonitorTimer = setInterval(monitorFacePresence, 700);
  };

  document.getElementById('presenceConfirm').addEventListener('click', async event => {
    event.stopImmediatePropagation();
    const button = document.getElementById('presenceConfirm');
    try {
      button.disabled = true;
      button.innerText = 'Activando cámara...';
      await startPresenceCamera();
      document.getElementById('presenceText').innerText = activePresenceChallenge?.text || 'Buscando un rostro frente a la cámara...';
      button.innerText = 'Validando presencia...';
    } catch (error) {
      stopPresenceCamera();
      button.disabled = false;
      button.innerText = 'Reintentar validación';
      document.getElementById('presenceText').innerText = error.message || 'No fue posible acceder a la cámara. Autoriza el permiso para continuar.';
    }
  }, true);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '400',
      width: '100%',
      videoId: videos[currentVideoIndex],
      playerVars: {
        controls: 0,       // ❌ quita controles
        disablekb: 1,      // ❌ bloquea teclado
        modestbranding: 1,
        rel: 0
      },
      events: {
        'onReady': onReady,
        'onStateChange': onStateChange,
        'onPlaybackRateChange': enforceNormalSpeed
      }
    });
  }

  async function onReady() {

    player.unMute();
    player.setVolume(100);
    player.setPlaybackRate(1);
    openPresenceCheck(true);

    // 🔥 cargar progreso
    setTimeout(() => {
      loadProgress();
    }, 1000);

    setInterval(track, 5000);
    updateStatus();
  }

  async function loadProgress() {
    try {

      const res = await fetch("/video-progress", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (!res.ok) {
        console.error("ERROR:", res.status);
        return;
      }

      const data = await res.json();

      console.log("PROGRESO RECIBIDO:", data);

      videoProgressMap = {};
      let lastVideoIndex = 0;

      data.forEach(row => {

        videoProgressMap[row.videoIndex] = {
          progress: row.progress,
          completed: row.completed
        };

        if (!row.completed) {
          lastVideoIndex = row.videoIndex;
        } else {
          lastVideoIndex = Math.max(lastVideoIndex, row.videoIndex);
        }
      });

      updateExamAvailability(data);

      console.log("MAPA FINAL:", videoProgressMap);

      currentVideoIndex = lastVideoIndex;

      // 🔥 RESET DEL SEEK (IMPORTANTE)
      window._seekDone = false;

      if (presenceAuthorized) player.loadVideoById(videos[currentVideoIndex]);
      else player.cueVideoById(videos[currentVideoIndex]);

    } catch (err) {
      console.error("ERROR loadProgress:", err);
    }
  }

  // 🔄 CAMBIO DE ESTADO (cuando termina video)
  function onStateChange(event) {

    // YouTube puede intentar reproducir al cargar el video: nunca permitimos
    // reproducción ni avance antes de aprobar la validación inicial.
    if (event.data === YT.PlayerState.PLAYING && !presenceAuthorized) {
      player.pauseVideo();
      openPresenceCheck(true);
      return;
    }

    // 🔥 REANUDAR EN EL MOMENTO CORRECTO
    if (event.data === YT.PlayerState.PLAYING) {

      const saved = videoProgressMap[currentVideoIndex]?.progress || 0;

      if (!saved || saved <= 0) return;

      const d = player.getDuration();
      if (!d || d === 0) return;

      const savedTime = (saved / 100) * d;

      console.log("🎯 REANUDANDO EN:", savedTime);

      // 🔥 AQUÍ VA LO QUE ME PREGUNTAS
      if (!window._seekDone) {

        player.seekTo(savedTime, true);

        maxTime = savedTime;

        window._seekDone = true;

        // 🔥 DAR TIEMPO PARA QUE EL SEEK SE APLIQUE
        allowTracking = false;

        setTimeout(() => {
          allowTracking = true;
        }, 2000); // 2 segundos es perfecto
      }
    }

    // 🔥 CUANDO TERMINA EL VIDEO
    if (event.data === YT.PlayerState.ENDED) {

      window._seekDone = false;

      videoProgressMap[currentVideoIndex] = {
        completed: true,
        progress: 100
      };

      fetch("/log-video", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ progress: 100, videoIndex: currentVideoIndex })
      }).then(() => refreshExamAvailability());

      if (currentVideoIndex < videos.length - 1) {

        currentVideoIndex++;
        resetTracking();

        // 🔥 IMPORTANTE TAMBIÉN AQUÍ
        window._seekDone = false;

        player.loadVideoById(videos[currentVideoIndex]);
        updateStatus();

      } else {

        document.getElementById("status").innerText = "✅ Curso completado";
        refreshExamAvailability();
      }
    }
  }


  function resetTracking() {
    duration = 0;
    maxTime = 0;
    lastSent = 0; // 🔥 ESTE ES EL QUE TE FALTABA
    presenceChecks = [];
    presenceCheckIndex = 0;
  }

  function setupPresenceChecks() {
    if (presenceChecks.length || !duration) return;
    const savedProgress = Number(videoProgressMap[currentVideoIndex]?.progress || 0);
    const start = Math.max(12, Math.min(72, savedProgress + 8));
    const end = 91;
    const checks = [];
    for (let index = 0; index < PRESENCE_CHECKS_PER_VIDEO; index++) {
      const base = start + ((end - start) * (index + 1) / (PRESENCE_CHECKS_PER_VIDEO + 1));
      checks.push(Math.round(Math.max(start, Math.min(end, base + (Math.random() * 10 - 5)))));
    }
    presenceChecks = [...new Set(checks)].sort((a,b) => a - b);
  }


  function track() {

    if (!player || typeof player.getCurrentTime !== "function") return;

    const state = player.getPlayerState();

    if (
      state !== YT.PlayerState.PLAYING &&
      state !== YT.PlayerState.PAUSED
    ) return;

    const current = player.getCurrentTime();

    // 🔥 asegurar duración válida
    if (!duration || duration === 0) {
      duration = player.getDuration();
      if (!duration || duration === 0) return;
    }
    setupPresenceChecks();

/* console.log("allowTracking:", allowTracking); */
    // 🚫 BLOQUEO ANTI-SKIP
    /* if (!allowTracking) return; */

    if (current > maxTime + 8) {
      player.seekTo(Math.max(0, maxTime - 1));
    } else {
      maxTime = Math.max(maxTime, current);
    }

    // 🎯 PROGRESO REAL DEL VIDEO (0–100)
     const percentCurrentVideo = Math.min(
       100,
       Math.max(0, (maxTime / duration) * 100)
     );
    if (!presenceAwaiting && presenceChecks[presenceCheckIndex] !== undefined && percentCurrentVideo >= presenceChecks[presenceCheckIndex]) {
      openPresenceCheck(false);
      return;
    }
    /* const percentCurrentVideo = (maxTime / duration) * 100; */
    // 🎯 PROGRESO REAL DEL VIDEO (0–100)


    // 📊 PROGRESO TOTAL (solo UI)
    /*   const totalProgress =
        ((currentVideoIndex + (percentCurrentVideo / 100)) / videos.length) * 100; */

    // 📊 PROGRESO TOTAL (solo UI)
    const totalProgress = (
      (currentVideoIndex * 100 + percentCurrentVideo)
      / (videos.length * 100)
    ) * 100;

    /* console.log("TRACK:", {
      video: currentVideoIndex,
      percentVideo: percentCurrentVideo.toFixed(2),
      total: totalProgress.toFixed(2),
      lastSent
    }); */

    // 🔥 UI
    document.getElementById("progress-fill").style.width = totalProgress + "%";
    document.getElementById("progress").innerText =
      "Progreso total: " + Math.floor(totalProgress) + "%";



    // 🚀 ENVÍO CONTROLADO (SOLO POR VIDEO, NO TOTAL)
    if (percentCurrentVideo - lastSent >= 3) {

      lastSent = percentCurrentVideo;

      fetch("/log-video", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          progress: percentCurrentVideo,   // ✅ porcentaje correcto
          videoIndex: currentVideoIndex
        })


      })
        .then(res => res.json())
        .then(data => console.log("💾 guardado:", data))
        .catch(err => console.error("❌ error log-video:", err));
    }
  }

  // 🧠 STATUS UX
  function updateStatus() {

    let statusText = `🎥 Video ${currentVideoIndex + 1} de ${videos.length}`;

    if (videoProgressMap[currentVideoIndex]?.completed) {
      statusText += " ✔ Completado";
    }

    document.getElementById("status").innerText = statusText;
  }

  // 🚀 IR AL EXAMEN (VALIDADO)
  async function goExam() {

    const res = await fetch("/can-take-exam", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const data = await res.json();

    if (data.ok) {
      window.location.href = "/examen.html";
    } else {
      const progress = isNaN(data.progress) ? 0 : Math.floor(data.progress);
      alert(`Debes completar más del 95% del curso.\nProgreso actual: ${progress}%`);
    }
  }

  function updateExamAvailability(progressRows) {
    const requiredVideos = [0, 1];
    const total = requiredVideos.reduce((sum, index) => {
      const row = progressRows.find(item => Number(item.videoIndex) === index);
      return sum + Number(row?.progress || 0);
    }, 0) / requiredVideos.length;
    const button = document.getElementById("btnExam");
    const allowed = total > 95;
    button.disabled = !allowed;
    button.hidden = !allowed;
  }

  async function refreshExamAvailability() {
    try {
      const res = await fetch("/video-progress", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (res.ok) updateExamAvailability(await res.json());
    } catch (err) {
      console.error("ERROR exam availability:", err);
    }
  }


  function togglePlay() {
    if (!presenceAuthorized) {
      openPresenceCheck(true);
      return;
    }
    if (presenceAwaiting) return;
    const state = player.getPlayerState();

    if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }

  function enforceNormalSpeed() {
    if (player && player.getPlaybackRate() !== 1) player.setPlaybackRate(1);
  }

  async function toggleFullscreen() {
    if (!presenceAuthorized || presenceAwaiting) {
      openPresenceCheck(true);
      return;
    }
    const wrapper = document.getElementById("videoWrapper");
    try {
      if (!document.fullscreenElement) {
        await wrapper.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (err) {
      console.error("No fue posible cambiar a pantalla completa:", err);
    }
  }

  document.addEventListener("contextmenu", e => e.preventDefault());


  document.addEventListener("click", function (e) {
    if (e.target.closest("a")) {
      e.preventDefault();
    }
  });

</script>

<script>
  function goBack() {

    const path = window.location.pathname;

    if (path.includes("certificado")) {
      window.location.href = "/examen.html";

    } else if (path.includes("examen")) {
      window.location.href = "/curso.html";

    } else if (path.includes("curso")) {
      sessionStorage.clear();
      window.location.href = "/";

    } else if (path.includes("documentos")) {
      window.location.href = "/portal.html";

    } else if (path.includes("portal")) {
      window.location.href = "/";

    } else {
      window.history.back(); // fallback
    }
  }
</script>
