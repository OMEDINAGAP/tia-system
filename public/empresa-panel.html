<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personas de la empresa - TIA</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;color:white}.container{box-sizing:border-box;width:min(1150px,calc(100% - 32px));margin:32px auto}.header,.card{background:#1e293b;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.header h1{margin:0;font-size:24px}.header p{margin:6px 0 0;color:#cbd5e1}.actions{display:flex;gap:10px}button{padding:11px 18px;border:0;border-radius:8px;background:#22c55e;color:white;font-weight:bold;cursor:pointer}.secondary{background:#334155}.download{padding:7px 10px;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{text-align:left;padding:12px;border-bottom:1px solid #334155}th{color:#94a3b8;font-size:13px}.folio{font-weight:bold;color:#4ade80;white-space:nowrap}.progress-track{width:120px;height:8px;background:#334155;border-radius:10px;overflow:hidden;margin-bottom:4px}.progress-fill{height:100%;background:#22c55e}.complete{color:#4ade80;font-weight:bold}.empty{text-align:center;color:#94a3b8;padding:35px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{background:#1e293b;border-radius:16px;padding:25px;width:min(650px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:5px}input{box-sizing:border-box;width:100%;padding:11px;border:0;border-radius:8px}.full{grid-column:1/-1}.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}@media(max-width:650px){.header{align-items:flex-start;gap:16px;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="container"><section class="header"><div><h1>Personas registradas</h1><p id="empresa">Cargando empresa...</p></div><div class="actions"><button class="secondary" onclick="goRequirements()">Requisitos</button><button onclick="openModal()">+ Registrar persona</button><button class="secondary" onclick="logout()">Salir</button></div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Folio personal</th><th>Nombre</th><th>Puesto</th><th>Telefono</th><th>Correo</th><th>Avance</th><th>Constancia</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">Aun no hay personas registradas.</div></div></section></main>
<div class="modal" id="modal"><div class="modal-card"><h2>Registrar persona</h2><form id="personForm"><div class="grid"><div><label>Nombres</label><input name="nombres" required autofocus></div><div><label>Apellido paterno</label><input name="apellidoPaterno" required></div><div><label>Apellido materno</label><input name="apellidoMaterno"></div><div><label>Puesto</label><input name="puesto" required></div><div><label>Telefono</label><input name="telefono" type="tel" required></div><div><label>Correo</label><input name="correo" type="email" required></div></div><div class="modal-actions"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button type="submit">Guardar persona</button></div></form></div></div>
<script>/* Código migrado a /js/empresa-panel.js.
const token=sessionStorage.getItem('gestionEmpresaToken');if(!token)location.replace('/');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadPeople(){const r=await fetch('/empresa-personas',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.ok){sessionStorage.clear();await Swal.fire('Sesion expirada',d.message||'Ingresa nuevamente','warning');location.replace('/');return}document.getElementById('empresa').textContent=d.empresa;document.getElementById('empty').style.display=d.personas.length?'none':'block';document.getElementById('rows').innerHTML=d.personas.map(p=>{const n=Math.max(0,Math.min(100,Math.round(Number(p.progreso)||0)));const s=p.aprobado?'<span class="complete">Curso terminado</span>':`<div class="progress-track"><div class="progress-fill" style="width:${n}%"></div></div><small>${n}% completado</small>`;const c=p.aprobado?`<button class="download" onclick="downloadCertificate(${Number(p.id)},'${esc(p.folio)}')">Descargar PDF</button>`:'<small>No disponible</small>';return `<tr><td class="folio">${esc(p.folio)}</td><td>${esc([p.nombres,p.apellido_paterno,p.apellido_materno].filter(Boolean).join(' '))}</td><td>${esc(p.puesto)}</td><td>${esc(p.telefono)}</td><td>${esc(p.correo)}</td><td>${s}</td><td>${c}</td></tr>`}).join('')}
async function downloadCertificate(id,folio){const r=await fetch(`/empresa-personas/${id}/constancia`,{headers:{Authorization:'Bearer '+token}});if(!r.ok){const d=await r.json();Swal.fire('Error',d.message||'No fue posible descargar','error');return}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`constancia-${folio}.pdf`;a.click();URL.revokeObjectURL(u)}
