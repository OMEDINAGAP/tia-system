<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persona del curso - TIA</title><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;color:white}.container{box-sizing:border-box;background:#1e293b;border-radius:16px;padding:30px;width:min(700px,calc(100% - 32px));margin:40px auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}h2{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:5px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:0}.full{grid-column:1/-1}button{margin-top:20px;background:#22c55e;color:white;font-weight:bold;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main class="container"><h2>Persona que tomara el curso</h2><form id="form"><div class="grid"><div><label>Nombres</label><input name="nombres" required></div><div><label>Apellido paterno</label><input name="apellidoPaterno" required></div><div><label>Apellido materno</label><input name="apellidoMaterno"></div><div><label>Puesto</label><input name="puesto" required></div><div><label>Telefono</label><input name="telefono" type="tel" required></div><div><label>Correo</label><input name="correo" type="email" required></div></div><button>Guardar y continuar</button></form></main>
<script>const token=sessionStorage.getItem('registroPersonaToken');if(!token)location.replace('/');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/registro-persona',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(d)});const x=await r.json();if(!r.ok||!x.ok){Swal.fire('Error',x.message||'No fue posible guardar','error');return}sessionStorage.clear();await Swal.fire('Registro completo','La persona fue registrada correctamente','success');location.replace('/')});</script></body></html>
