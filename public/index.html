<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Acceso TIA</title>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: #1e293b;
      border-radius: 16px;
      padding: 30px;
      width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 10px;
      cursor: pointer;
      background: #020617;
      text-align: center;
    }

    .tab.active {
      background: #22c55e;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
    }

    .flight-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,17,31,.82);backdrop-filter:blur(3px);opacity:0;pointer-events:none;z-index:100;transition:opacity .25s ease}.flight-overlay.active{opacity:1;pointer-events:auto}.flight-scene{position:relative;width:min(520px,90vw);height:250px;overflow:hidden}.flight-cloud{position:absolute;color:#dbeafe;opacity:.25;font-size:34px;animation:cloudDrift 5s linear infinite}.cloud-one{top:25px;left:5%}.cloud-two{top:70px;right:4%;animation-delay:-2.6s}.runway{position:absolute;bottom:34px;left:8%;right:8%;height:8px;border-radius:20px;background:#31445c;box-shadow:0 0 0 2px rgba(148,163,184,.12)}.runway:after{content:'';position:absolute;inset:2px 12px;background:repeating-linear-gradient(90deg,#f8fafc 0 24px,transparent 24px 48px);opacity:.7}.aircraft{position:absolute;left:-130px;bottom:68px;font-size:62px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.4));transform:rotate(-10deg)}.flight-overlay.landing .aircraft{animation:planeLand 1.05s cubic-bezier(.2,.85,.25,1) forwards}.flight-overlay.waiting .aircraft{left:calc(50% - 34px);transform:rotate(0deg);animation:planeIdle 1.2s ease-in-out infinite}.flight-overlay.takeoff .aircraft{left:calc(50% - 34px);transform:rotate(-18deg);animation:planeTakeoff .85s cubic-bezier(.55,.01,.76,.44) forwards}.flight-message{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#dce7f5;font-size:15px;font-weight:600;opacity:0;transition:opacity .25s}.flight-overlay.active .flight-message{opacity:1}@keyframes planeLand{0%{left:-130px;bottom:165px;transform:rotate(-16deg)}70%{left:calc(50% - 45px);bottom:68px;transform:rotate(-2deg)}100%{left:calc(50% - 34px);bottom:68px;transform:rotate(0)}}@keyframes planeTakeoff{0%{left:calc(50% - 34px);bottom:68px;opacity:1}100%{left:110%;bottom:220px;opacity:0;transform:rotate(-18deg)}}@keyframes planeIdle{50%{transform:translateY(-5px)}}@keyframes cloudDrift{from{transform:translateX(-18px)}to{transform:translateX(22px)}}@media(prefers-reduced-motion:reduce){.flight-overlay,.aircraft,.flight-cloud{animation:none!important;transition:none!important}}
  </style>
</head>

<body>

  <div class="flight-overlay" id="flightOverlay" aria-live="polite"><div class="flight-scene"><span class="flight-cloud cloud-one">☁</span><span class="flight-cloud cloud-two">☁</span><div class="aircraft">✈️</div><div class="runway"></div><div class="flight-message" id="flightMessage">Preparando tu acceso...</div></div></div>

  <div class="container">

    <h2>✈️ Sistema TIA</h2>

    <p style="text-align:center;color:#cbd5e1;font-size:14px;line-height:1.5">
      Ingresa el folio que te fue proporcionado para acceder al sistema.
    </p>

    <div class="form active" id="formOld">
      <input id="userId" placeholder="Folio (ej. TIA-123456)" autocomplete="username" maxlength="50" autofocus>
      <button onclick="loginById()">Ingresar</button>
    </div>

    <div class="form" id="credentialsForm">
      <input id="empresaUsuario" placeholder="Usuario" autocomplete="username" maxlength="80">
      <input id="empresaPassword" type="password" placeholder="Contrasena" autocomplete="current-password">
      <button onclick="loginEmpresa()">Continuar</button>
    </div>

    <div class="footer">
      Sistema de Capacitación Aeroportuaria
    </div>

  </div>

  <script>

    let flightTimer;
    function beginLoginFlight() {
      const overlay = document.getElementById('flightOverlay');
      document.getElementById('flightMessage').textContent = 'Verificando tu acceso...';
      overlay.className = 'flight-overlay active landing';
      clearTimeout(flightTimer);
      flightTimer = setTimeout(() => overlay.className = 'flight-overlay active waiting', 1050);
    }
    function cancelLoginFlight() {
      clearTimeout(flightTimer);
      document.getElementById('flightOverlay').className = 'flight-overlay';
    }
    function departTo(url) {
      clearTimeout(flightTimer);
      const overlay = document.getElementById('flightOverlay');
      document.getElementById('flightMessage').textContent = '¡Acceso confirmado! Buen vuelo.';
      overlay.className = 'flight-overlay active takeoff';
      setTimeout(() => window.location.href = url, 780);
    }

    function switchTab(index) {

      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".form").forEach(f => f.classList.remove("active"));

      document.querySelectorAll(".tab")[index].classList.add("active");
      document.querySelectorAll(".form")[index].classList.add("active");
    }

  */

    async function loginNew() {

      const apellidoPaterno =
        document.getElementById("apellidoPaterno").value.trim();

      const apellidoMaterno =
        document.getElementById("apellidoMaterno").value.trim();

      const nombre =
        document.getElementById("nombre").value.trim();

      const company =
        document.getElementById("company").value.trim();

      const puesto =
        document.getElementById("puesto").value.trim();

      const telefono =
        document.getElementById("telefono").value.trim();

      const correo =
        document.getElementById("correo").value.trim();

      const pass =
        document.getElementById("pass").value.trim();

      // 🔥 nombre completo final
      const name =
        `${apellidoPaterno} ${apellidoMaterno} ${nombre}`;

      if (
        !apellidoPaterno ||
        !apellidoMaterno ||
        !nombre ||
        !company ||
        !puesto ||
        !telefono ||
        !correo ||
        !pass
      ) {

        Swal.fire(
          "??",
          "Completa todos los campos",
          "warning"
        );

        return;
      }

      // ?? VALIDAR Y CREAR USUARIO
      const res = await fetch("/validate-new", {
        method: "POST",
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name,
          company,
          puesto,
          telefono,
          correo,
          pass
        })
      });

      const data = await res.json();

      if (data.ok) {

        // ? GUARDAR FOLIO ORIGINAL
        const folio = data.folio;

        // ?? CREAR SESIÓN
        await fetch("/log-login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name,
            company,
            puesto,
            telefono,
            correo
          })

        })
          .then(res => res.json())
          .then(session => {

            // ? TOKEN
            sessionStorage.setItem(
              "token",
              session.token
            );

            // ?? MENSAJE
            Swal.fire({

              title: "Registro exitoso",

              html: `
          Tu folio es:<br>
          <b>${folio}</b>
        `,

              confirmButtonText: "Continuar",

              background: "#0f172a",
              color: "#fff"

            }).then(() => {

              window.location.href = "/portal.html";

            });

          });

      }
    }


    async function loginById() {
      const folio = document.getElementById("userId").value.trim().toUpperCase();
      if (!folio) { Swal.fire("Aviso", "Ingresa tu folio", "warning"); return; }
      beginLoginFlight();
      try {
        const res = await fetch("/folio-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ folio }) });
        const data = await res.json();
        if (!res.ok || !data.ok) { cancelLoginFlight(); Swal.fire("Error", data.message || "Folio no encontrado", "error"); return; }
        if (data.persona) {
          sessionStorage.clear();
          sessionStorage.setItem("token", data.token);
          sessionStorage.setItem("userId", String(data.userId));
          departTo(data.pendingPhoto ? "/foto-final.html" : "/carta-compromiso.html");
          return;
        }
        if (data.requiereCredenciales) {
          cancelLoginFlight();
          sessionStorage.setItem("folio", data.folio);
          document.getElementById("formOld").classList.remove("active");
          document.getElementById("credentialsForm").classList.add("active");
          document.getElementById("empresaUsuario").focus();
          return;
        }
        if (data.configurarCuenta) {
          sessionStorage.setItem("configurarCuentaToken", data.token);
          departTo("/cuenta.html");
          return;
        }
        if (!data.token) { cancelLoginFlight(); Swal.fire("Error", "No se genero la sesion", "error"); return; }
        sessionStorage.clear();
        sessionStorage.setItem("registroEmpresaToken", data.token);
        sessionStorage.setItem("folio", data.folio);
        sessionStorage.setItem("empresaAutorizada", data.empresa || "");
        departTo("/empresa.html");
      } catch (err) {
        console.error(err);
        cancelLoginFlight();
        Swal.fire("Error", "No fue posible conectar con el servidor", "error");
      }
    }

    document.getElementById("userId").addEventListener("keydown", event => {
      if (event.key === "Enter") loginById();
    });

    async function loginEmpresa() {
      const folio = sessionStorage.getItem("folio");
      const usuario = document.getElementById("empresaUsuario").value.trim();
      const password = document.getElementById("empresaPassword").value;
      if (!usuario || !password) { Swal.fire("Aviso", "Ingresa usuario y contrasena", "warning"); return; }
      beginLoginFlight();
      try {
        const res = await fetch("/login-empresa", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ folio, usuario, password })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { cancelLoginFlight(); Swal.fire("Error", data.message || "Credenciales incorrectas", "error"); return; }
        sessionStorage.clear();
        sessionStorage.setItem("gestionEmpresaToken", data.token);
        departTo("/empresa-requisitos.html");
      } catch (error) { cancelLoginFlight(); Swal.fire("Error", "No fue posible conectar con el servidor", "error"); }
    }
  </script>

</body>
