    .container {
      background: #1e293b;

    .tabs {

    .tab {

      padding: 10px;
      cursor: pointer;
      background: #020617;
      text-align: center;

    .form {

    }

      width: 100%;

      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
    }

<body>

  <div class="container">

    <h2>✈️ Sistema TIA</h2>

    <p style="text-align:center;color:#cbd5e1;font-size:14px;line-height:1.5">
      Ingresa el folio que te fue proporcionado para acceder al sistema.
    </p>

    <div class="form active" id="formOld">
      <input id="userId" placeholder="Folio (ej. TIA-123456)" autocomplete="username" maxlength="50" autofocus>
      <button onclick="loginById()">Ingresar</button>
    </div>

    <div class="form" id="credentialsForm">
      <input id="empresaUsuario" placeholder="Usuario" autocomplete="username" maxlength="80">
      <input id="empresaPassword" type="password" placeholder="Contrasena" autocomplete="current-password">
      <button onclick="loginEmpresa()">Continuar</button>
    </div>

    <div class="footer">
      Sistema de Capacitación Aeroportuaria
    </div>

  </div>

  <script>

      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".form").forEach(f => f.classList.remove("active"));

      document.querySelectorAll(".tab")[index].classList.add("active");
      document.querySelectorAll(".form")[index].classList.add("active");
    }

    async function loginNew() {

      const apellidoPaterno =
        document.getElementById("apellidoPaterno").value.trim();

      const apellidoMaterno =
        document.getElementById("apellidoMaterno").value.trim();

      const nombre =
        document.getElementById("nombre").value.trim();

      const company =
        document.getElementById("company").value.trim();

      const puesto =
        document.getElementById("puesto").value.trim();

      const telefono =
        document.getElementById("telefono").value.trim();

      const correo =
        document.getElementById("correo").value.trim();

      const pass =
        document.getElementById("pass").value.trim();

      // 🔥 nombre completo final
      const name =
        `${apellidoPaterno} ${apellidoMaterno} ${nombre}`;

      if (
        !apellidoPaterno ||
        !apellidoMaterno ||
        !nombre ||
        !company ||
        !puesto ||
        !telefono ||
        !correo ||
        !pass
      ) {

        Swal.fire(
          "??",
          "Completa todos los campos",
          "warning"
        );

        return;
      }

      // ?? VALIDAR Y CREAR USUARIO
      const res = await fetch("/validate-new", {
        method: "POST",
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name,
          company,
          puesto,
          telefono,
          correo,
          pass
        })
      });

      const data = await res.json();

      if (data.ok) {

        // ? GUARDAR FOLIO ORIGINAL
        const folio = data.folio;

        // ?? CREAR SESIÓN
        await fetch("/log-login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name,
            company,
            puesto,
            telefono,
            correo
          })

        })
          .then(res => res.json())
          .then(session => {

            // ? TOKEN
            sessionStorage.setItem(
              "token",
              session.token
            );

            // ?? MENSAJE
            Swal.fire({

              title: "Registro exitoso",

              html: `
          Tu folio es:<br>
          <b>${folio}</b>
        `,

              confirmButtonText: "Continuar",

              background: "#0f172a",
              color: "#fff"

            }).then(() => {

              window.location.href = "/portal.html";

            });

          });

      }
    }


    async function loginById() {
      const folio = document.getElementById("userId").value.trim().toUpperCase();
      if (!folio) { Swal.fire("Aviso", "Ingresa tu folio", "warning"); return; }
      try {
        const res = await fetch("/folio-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ folio }) });
        const data = await res.json();
        if (!res.ok || !data.ok) { Swal.fire("Error", data.message || "Folio no encontrado", "error"); return; }
        if (data.persona) {
          sessionStorage.clear();
          sessionStorage.setItem("token", data.token);
          sessionStorage.setItem("userId", String(data.userId));
          window.location.href = data.pendingPhoto ? "/foto-final.html" : "/portal.html";
          return;
        }
        if (data.requiereCredenciales) {
          sessionStorage.setItem("folio", data.folio);
          document.getElementById("formOld").classList.remove("active");
          document.getElementById("credentialsForm").classList.add("active");
          document.getElementById("empresaUsuario").focus();
          return;
        }
        if (data.configurarCuenta) {
          sessionStorage.setItem("configurarCuentaToken", data.token);
          window.location.href = "/cuenta.html";
          return;
        }
        if (!data.token) { Swal.fire("Error", "No se genero la sesion", "error"); return; }
        sessionStorage.clear();
        sessionStorage.setItem("registroEmpresaToken", data.token);
        sessionStorage.setItem("folio", data.folio);
        sessionStorage.setItem("empresaAutorizada", data.empresa || "");
        window.location.href = "/empresa.html";
      } catch (err) {
        console.error(err);
        Swal.fire("Error", "No fue posible conectar con el servidor", "error");
      }
    }

    document.getElementById("userId").addEventListener("keydown", event => {
      if (event.key === "Enter") loginById();
    });

    async function loginEmpresa() {
      const folio = sessionStorage.getItem("folio");
      const usuario = document.getElementById("empresaUsuario").value.trim();
      const password = document.getElementById("empresaPassword").value;
      if (!usuario || !password) { Swal.fire("Aviso", "Ingresa usuario y contrasena", "warning"); return; }
      try {
        const res = await fetch("/login-empresa", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ folio, usuario, password })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { Swal.fire("Error", data.message || "Credenciales incorrectas", "error"); return; }
        sessionStorage.clear();
        sessionStorage.setItem("gestionEmpresaToken", data.token);
        window.location.href = "/empresa-panel.html";
      } catch (error) { Swal.fire("Error", "No fue posible conectar con el servidor", "error"); }
    }
  </script>
